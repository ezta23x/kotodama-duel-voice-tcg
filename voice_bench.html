<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>言霊デュエル — 真实声学 ASR 压测台（276 重要句 × 4 工况）</title>
<style>
  :root {
    --bg: #0f1419; --card: #19222c; --line: #2a3746; --ink: #e7edf4; --sub: #94a3b8;
    --ok: #22c55e; --bad: #ef4444; --warn: #f59e0b; --accent: #38bdf8;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); line-height: 1.5; }
  .wrap { max-width: 1220px; margin: 0 auto; padding: 20px; }
  h1 { margin: 0 0 6px; font-size: 20px; }
  .sub { color: var(--sub); font-size: 13px; margin-bottom: 16px; }
  .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; }
  select, button { background: #233040; color: var(--ink); border: 1px solid var(--line); border-radius: 7px; padding: 7px 12px; font-size: 13px; cursor: pointer; }
  button.primary { background: #0284c7; border-color: #0ea5e9; font-weight: 600; }
  button.danger { background: #991b1b; border-color: #dc2626; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .stat .k { font-size: 12px; color: var(--sub); }
  .stat .v { font-size: 22px; font-weight: 700; margin-top: 4px; }
  .stat .v.ok { color: var(--ok); }
  .stat .v.bad { color: var(--bad); }
  .prog { height: 8px; background: #1e293b; border-radius: 99px; overflow: hidden; margin-bottom: 14px; }
  .prog > div { height: 100%; width: 0%; background: linear-gradient(90deg, #0ea5e9, #22c55e); transition: width 0.2s; }
  table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; font-size: 12.5px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { background: #141c24; color: var(--sub); font-weight: 600; position: sticky; top: 0; }
  .tag { display: inline-block; padding: 2px 6px; border-radius: 5px; font-size: 11px; font-weight: 600; }
  .tag.pass { background: rgba(34,197,94,0.16); color: #86efac; }
  .tag.fail { background: rgba(239,68,68,0.18); color: #fca5a5; }
  .tag.fe { background: #7f1d1d; color: #fecaca; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; }
  .status-line { font-size: 12.5px; color: var(--accent); margin-bottom: 10px; min-height: 20px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>言霊デュエル — 真实声学 ASR 压测台</h1>
  <div class="sub">复用 <code>app.js</code> 内置 Vertex Gemini TTS + SenseTime Nia 流式 ASR + 本地 0ms NLU（零重复造轮子，不触碰游戏主 UI）。TTS 音频自动缓存在浏览器 IndexedDB，二刷零额外 TTS 消耗。</div>

  <div class="bar">
    <label>分类筛选：
      <select id="selCat">
        <option value="ALL">全部重要句（276 句）</option>
      </select>
    </label>
    <label>声学工况：
      <select id="selMode">
        <option value="1">1× 安静室 (Clean) — 276 次</option>
        <option value="2" selected>2× 安静 + 10dB 空调粉噪 — 552 次</option>
        <option value="4">4× 全工况 (安静/粉噪/咖啡馆键盘/1.2×快语速截头) — 1104 次</option>
      </select>
    </label>
    <label>显示：
      <select id="selFilter">
        <option value="ALL">全部结果</option>
        <option value="FAIL">仅看失败/误触</option>
      </select>
    </label>
    <button id="btnStart" class="primary">开始真实 TTS→ASR 压测</button>
    <button id="btnPause" disabled>暂停</button>
    <button id="btnExport" disabled>导出 golden_asr_corpus.json</button>
    <button id="btnClearCache" class="danger">清空 TTS 缓存</button>
  </div>

  <div class="status-line" id="statusLine">正在加载 app.js 与 gamedata.json…</div>
  <div class="prog"><div id="progBar"></div></div>

  <div class="stats">
    <div class="stat"><div class="k">已完成 / 总计</div><div class="v" id="stDone">0 / 0</div></div>
    <div class="stat"><div class="k">端到端通过率</div><div class="v ok" id="stAcc">-</div></div>
    <div class="stat"><div class="k">负样本误执行率</div><div class="v ok" id="stFe">0.00%</div></div>
    <div class="stat"><div class="k">TTS 缓存命中</div><div class="v" id="stCache">0</div></div>
    <div class="stat"><div class="k">平均 ASR 耗时</div><div class="v" id="stLat">-</div></div>
  </div>

  <table>
    <thead>
      <tr>
        <th style="width:46px">#</th>
        <th style="width:120px">分类 / 工况</th>
        <th>原始口语（TTS 输入）</th>
        <th>Nia 实际转写</th>
        <th style="width:180px">期望 vs 实际 NLU</th>
        <th style="width:74px">结果</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<script>
  window.__KOTODAMA_BENCH_MODE__ = true;
</script>

  /* ---------- IndexedDB TTS Audio Cache ---------- */
  const DB_NAME = "kotodama_voice_bench_v1";
  const STORE_NAME = "tts_pcm";
  let dbPromise = null;
  function openDb() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = () => {
        if (!req.result.objectStoreNames.contains(STORE_NAME)) req.result.createObjectStore(STORE_NAME);
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    return dbPromise;
  }
  async function idbGet(key) {
    const db = await openDb();
    return new Promise((res, rej) => {
      const tx = db.transaction(STORE_NAME, "readonly");
      const r = tx.objectStore(STORE_NAME).get(key);
      r.onsuccess = () => res(r.result || null);
      r.onerror = () => rej(r.error);
    });
  }
  async function idbSet(key, val) {
    const db = await openDb();
    return new Promise((res, rej) => {
      const tx = db.transaction(STORE_NAME, "readwrite");
      tx.objectStore(STORE_NAME).put(val, key);
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);
    });
  }
  async function idbClear() {
    const db = await openDb();
    return new Promise((res, rej) => {
      const tx = db.transaction(STORE_NAME, "readwrite");
      tx.objectStore(STORE_NAME).clear();
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);
    });
  }

  /* ---------- Local WebAudio DSP Augmentations ---------- */
  function computeRms(arr) {
    let s = 0;
    for (let i = 0; i < arr.length; i++) s += arr[i] * arr[i];
    return Math.sqrt(s / Math.max(1, arr.length));
  }
  function applyDsp(pcm, sr, cond) {
    if (cond === "clean") return new Float32Array(pcm);
    const out = new Float32Array(pcm.length);
    const sigRms = Math.max(0.02, computeRms(pcm));
    if (cond === "pink10") {
      // Voss-style filtered pink noise at +10dB SNR
      let b0 = 0, b1 = 0, b2 = 0;
      const noise = new Float32Array(pcm.length);
      for (let i = 0; i < pcm.length; i++) {
        const w = Math.random() * 2 - 1;
        b0 = 0.997 * b0 + w * 0.029;
        b1 = 0.985 * b1 + w * 0.032;
        b2 = 0.950 * b2 + w * 0.048;
        noise[i] = b0 + b1 + b2 + w * 0.02;
      }
      const nRms = Math.max(1e-4, computeRms(noise));
      const scale = (sigRms / Math.pow(10, 10 / 20)) / nRms;
      for (let i = 0; i < pcm.length; i++) out[i] = Math.max(-1, Math.min(1, pcm[i] + noise[i] * scale));
      return out;
    }
    if (cond === "cafe8") {
      // Low-pass murmur + sparse keyboard clicks at +8dB SNR
      let lp = 0;
      const noise = new Float32Array(pcm.length);
      for (let i = 0; i < pcm.length; i++) {
        const w = Math.random() * 2 - 1;
        lp = lp * 0.92 + w * 0.08;
        let click = 0;
        if (Math.random() < 0.00025) click = (Math.random() * 2 - 1) * 0.7;
        noise[i] = lp + click;
      }
      const nRms = Math.max(1e-4, computeRms(noise));
      const scale = (sigRms / Math.pow(10, 8 / 20)) / nRms;
      for (let i = 0; i < pcm.length; i++) out[i] = Math.max(-1, Math.min(1, pcm[i] + noise[i] * scale));
      return out;
    }
    if (cond === "fast_vad") {
      // 1.20x speed + trim leading 45ms of active speech
      const speed = 1.20;
      const len = Math.max(1, Math.floor(pcm.length / speed));
      const fast = new Float32Array(len);
      for (let i = 0; i < len; i++) {
        const p = i * speed;
        const i0 = Math.floor(p);
        const f = p - i0;
        fast[i] = pcm[i0] * (1 - f) + (pcm[Math.min(pcm.length - 1, i0 + 1)] || 0) * f;
      }
      let firstSpeech = 0;
      for (let i = 0; i < fast.length; i++) {
        if (Math.abs(fast[i]) > 0.02) { firstSpeech = i; break; }
      }
      const clipSamples = Math.min(fast.length - 1, firstSpeech + Math.floor(sr * 0.045));
      return fast.slice(clipSamples);
    }
    return new Float32Array(pcm);
  }

  function evaluateCase(c, res) {
    const acts = res.actions || [];
    const isNeg = c.expected_status === "ignore_or_chat_or_clarify" || c.expected_status === "reject";
    const falseExec = isNeg && res.status === "execute";
    let pass = false;
    if (c.expected_status === "ignore_or_chat_or_clarify") {
      pass = res.status !== "execute" && acts.length === 0;
    } else if (c.expected_status === "reject") {
      pass = res.status === "reject" || (res.status !== "execute" && acts.length === 0);
    } else if (c.expected_status === "confirm") {
      pass = res.status === "confirm" || acts.some((a) => a.type === "SURRENDER");
    } else if (c.expected_status === "execute") {
      if (res.status === "execute") {
        if (c.expected_action === "COMBO") {
          const wantTypes = String(c.detail || "").split("+").filter(Boolean);
          const gotTypes = acts.map((a) => a.type);
          let cursor = 0;
          for (const wt of wantTypes) {
            const idx = gotTypes.indexOf(wt, cursor);
            if (idx === -1) { cursor = -1; break; }
            cursor = idx + 1;
          }
          pass = cursor !== -1;
        } else {
          pass = acts.some((a) => {
            if (a.type !== c.expected_action) return false;
            if (!c.detail) return true;
            if (c.expected_action === "ATTACK") {
              const norm = (s) => bench.SpecEngine.normalizeText(s || "");
              const d = norm(c.detail);
              const sn = norm(a.skill_name || "");
              if (!sn) return false;
              const mon = bench.SpecEngine.getMonster(c.active);
              const sk = mon?.skills?.find((s) => norm(s.name_ja) === sn || norm(s.name_zh) === sn);
              return sn === d || (sk && (norm(sk.name_ja) === d || norm(sk.name_zh) === d));
            }
            if (c.expected_action === "ATTACH_ENERGY" || c.expected_action === "USE_ITEM" || c.expected_action === "PLAY_BENCH") {
              return a.card_id === c.detail;
            }
            return true;
          });
        }
      }
    }
    return { pass, falseExec };
  }

  function detectLang(c) {
    if (c.category.startsWith("ja_")) return "ja";
    if (c.category.startsWith("zh_") || c.category === "cn_jp_mixed") return "zh";

      return { pcm: new Float32Array(cached.pcm), sampleRate: cached.sampleRate, fromCache: true };
    }
    const buf = await bench.VoiceEngine.fetchTtsAudioBuffer(text, role, lang);
    const pcm = new Float32Array(buf.getChannelData(0));
    await idbSet(key, { sampleRate: buf.sampleRate, pcm });
    return { pcm, sampleRate: buf.sampleRate, fromCache: false };
  }

  async function runNiaAsrOnPcm(pcm, sampleRate) {
    const sess = bench.VoiceEngine.createNiaAsrSession({ lang: "" });
    const chunkLen = Math.floor(sampleRate * 0.1); // 100ms chunks
    for (let off = 0; off < pcm.length; off += chunkLen) {
      const slice = pcm.subarray(off, Math.min(pcm.length, off + chunkLen));
      sess.pushFloat32(slice, sampleRate);
      await new Promise((r) => setTimeout(r, 15));
    }
    return String(await sess.finish() || "").trim();
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;" }[m]));
  }

  function renderStats(totalJobs) {
    const done = results.length;
    const passed = results.filter((r) => r.pass).length;
    const negRuns = results.filter((r) => r.is_negative);
    const feCount = negRuns.filter((r) => r.false_exec).length;
    const avgLat = done ? Math.round(results.reduce((a, r) => a + r.latency_ms, 0) / done) : 0;
    $("stDone").textContent = `${done} / ${totalJobs}`;
    $("stAcc").textContent = done ? `${((passed / done) * 100).toFixed(1)}% (${passed}/${done})` : "-";
    $("stAcc").className = "v " + (done && passed / done >= 0.9 ? "ok" : "bad");
    $("stFe").textContent = negRuns.length ? `${((feCount / negRuns.length) * 100).toFixed(2)}% (${feCount}/${negRuns.length})` : "0.00%";
    $("stFe").className = "v " + (feCount === 0 ? "ok" : "bad");
    $("stCache").textContent = String(cacheHits);
    $("stLat").textContent = done ? `${avgLat} ms` : "-";
    $("progBar").style.width = totalJobs ? `${Math.min(100, (done / totalJobs) * 100)}%` : "0%";
  }

  function renderTable() {
    const mode = $("selFilter").value;
    const rows = mode === "FAIL" ? results.filter((r) => !r.pass || r.false_exec) : results;
    $("tbody").innerHTML = rows.slice(-200).reverse().map((r) => {
      const tag = r.false_exec ? '<span class="tag fe">误触</span>' : (r.pass ? '<span class="tag pass">PASS</span>' : '<span class="tag fail">FAIL</span>');
      return `<tr>
        <td class="mono">${r.idx}</td>
        <td><div class="mono">${esc(r.category)}</div><div style="color:var(--sub);font-size:11px">${esc(r.condition)} (${r.lang})</div></td>
        <td>${esc(r.text)}</td>
        <td>${esc(r.asr_transcript || "(空)")}</td>
        <td class="mono"><div>want: ${esc(r.expected_status)}:${esc(r.expected_action)}${r.detail ? "(" + esc(r.detail) + ")" : ""}</div><div style="color:var(--sub)">got: ${esc(r.got_status)} [${esc(r.got_actions)}]</div></td>
        <td>${tag}</td>
      </tr>`;
    }).join("");
  }

  async function initBench() {
    bench = window.__KOTODAMA_BENCH__;
    if (!bench) {
      $("statusLine").textContent = "错误：未能加载 app.js 的压测钩子。";
      return;
    }
    bench.ConfigManager.load();
    const ok = await bench.SpecEngine.loadThreeTier();
    if (!ok) {
      $("statusLine").textContent = "错误：未能加载 ./gamedata.json，请通过本地 HTTP 服务打开（例如 python3 -m http.server 8000）。";
      return;
    }
    const cats = Array.from(new Set(CASES.map((c) => c.category)));
    for (const cat of cats) {
      const cnt = CASES.filter((c) => c.category === cat).length;
      const opt = document.createElement("option");
      opt.value = cat;
      opt.textContent = `${cat} (${cnt} 句)`;
      $("selCat").appendChild(opt);
    }
    $("statusLine").textContent = `就绪：已加载 ${CASES.length} 条独立口语盲测句 + gamedata.json，点击「开始真实 TTS→ASR 压测」启动。`;
  }

  $("selFilter").addEventListener("change", renderTable);
  $("btnPause").addEventListener("click", () => {
    paused = !paused;
    $("btnPause").textContent = paused ? "继续" : "暂停";
    $("statusLine").textContent = paused ? "已暂停（当前结果已保留，可随时继续或导出）。" : "继续执行中…";
  });
  $("btnClearCache").addEventListener("click", async () => {
    await idbClear();
    cacheHits = 0;
    $("stCache").textContent = "0";
    $("statusLine").textContent = "已清空浏览器 IndexedDB 中的 TTS 音频缓存。";
  });
  $("btnExport").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify({ exportedAt: new Date().toISOString(), total: results.length, results }, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "golden_asr_corpus.json";
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });

  $("btnStart").addEventListener("click", async () => {
    if (running || !bench) return;
    running = true;
    paused = false;
    results = [];
    cacheHits = 0;
    $("btnStart").disabled = true;
    $("btnPause").disabled = false;
    $("btnPause").textContent = "暂停";
    $("btnExport").disabled = false;

    const cat = $("selCat").value;
    const conds = CONDITION_SETS[$("selMode").value] || ["clean"];
    const selected = cat === "ALL" ? CASES : CASES.filter((c) => c.category === cat);
    const totalJobs = selected.length * conds.length;
    renderStats(totalJobs);
    renderTable();

    let jobIdx = 0;
    for (let i = 0; i < selected.length; i++) {
      const c = selected[i];
      const lang = detectLang(c);
      let master = null;
      while (paused) await new Promise((r) => setTimeout(r, 200));
      $("statusLine").textContent = `[${jobIdx + 1}/${totalJobs}] 正在获取 TTS：${c.text}`;
      try {
        master = await getOrSynthesizeTts(c.text, lang, i);
      } catch (err) {
        for (const cond of conds) {
          jobIdx += 1;
          results.push({
            idx: jobIdx, category: c.category, text: c.text, lang, condition: cond,
            asr_transcript: `[TTS_ERR: ${err?.message || err}]`,
            expected_status: c.expected_status, expected_action: c.expected_action, detail: c.detail || "",
            got_status: "error", got_actions: "", pass: false, false_exec: false,
            is_negative: NEG_CATS.has(c.category), latency_ms: 0
          });
        }
        renderStats(totalJobs);
        renderTable();
        continue;
      }

      for (const cond of conds) {
        while (paused) await new Promise((r) => setTimeout(r, 200));
        jobIdx += 1;
        $("statusLine").textContent = `[${jobIdx}/${totalJobs}] Nia 流式识别 (${cond})：${c.text}`;
        const t0 = performance.now();
        let asrText = "";
        let nlu = { status: "error", actions: [] };
        try {
          const aug = applyDsp(master.pcm, master.sampleRate, cond);
          asrText = await runNiaAsrOnPcm(aug, master.sampleRate);
          nlu = bench.NLUEngine.localParse(asrText, makeBoard(c.active), null, { isVoice: true });
        } catch (err) {
          asrText = `[ASR_ERR: ${err?.message || err}]`;
        }
        const latencyMs = Math.round(performance.now() - t0);
        const { pass, falseExec } = evaluateCase(c, nlu);
        results.push({
          idx: jobIdx, category: c.category, text: c.text, lang, condition: cond,
          asr_transcript: asrText,
          expected_status: c.expected_status, expected_action: c.expected_action, detail: c.detail || "",
          got_status: nlu.status,
          got_actions: (nlu.actions || []).map((a) => `${a.type}:${a.skill_name || a.card_id || ""}`).join("+"),
          pass, false_exec: falseExec, is_negative: NEG_CATS.has(c.category), latency_ms: latencyMs
        });
        renderStats(totalJobs);
        renderTable();
      }
    }

    running = false;
    $("btnStart").disabled = false;
    $("btnPause").disabled = true;
    $("statusLine").textContent = `压测完成！共执行 ${results.length} 次真实 TTS→Nia ASR→NLU 评测，可点击「导出 golden_asr_corpus.json」。`;
  });

  window.addEventListener("DOMContentLoaded", initBench);
})();
</script>
